# Centralized Configuration for XML Migration Tools
# Master template source (1 shared XML template with #{...} placeholders)
master_template_path: files/master_templates/master_config_extended.xml
out_template: templates/config_target.j2

# Multiple clients definition (each client gets its own vars and final config)
clients:
  - name: client5
    source_xml: files/client_sources/client5_source.xml
    out_vars: vars/vars_client5.yaml
    out_final: final/client5_source.xml
    out_report: reports/mappings/mapping_report_client5.txt
    summary_report: reports/summary_client5.txt

  - name: client6
    source_xml: files/client_sources/client7_source.xml
    out_vars: vars/vars_client7.yaml
    out_final: final/client7_source.xml
    out_report: reports/mappings/mapping_report_client7.txt
    summary_report: reports/summary_client7.txt

