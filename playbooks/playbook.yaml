- name: Prepare local directories
  hosts: localhost
  gather_facts: false
  vars:
    project_dir: "{{ playbook_dir }}"
    files_dir: "{{ project_dir }}/files"
    templates_dir: "{{ project_dir }}/templates"
    final_dir: "{{ project_dir }}/final"
    debug_dir: "{{ project_dir }}/debug"
  tasks:
    - name: Ensure local directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
      loop:
        - "{{ files_dir }}"
        - "{{ templates_dir }}"
        - "{{ final_dir }}"
        - "{{ debug_dir }}"

- name: Fetch master_config.xml from Windows
  hosts: windows
  gather_facts: false
  vars:
    project_dir: "{{ playbook_dir }}"
    remote_v5_path: "C:\\Users\\vboxuser\\Desktop\\project\\master_config.xml"
    local_v5_path: "{{ project_dir }}/files/master_templates/master_config.xml"
  tasks:
    - name: Fetch master_config.xml from Windows target
      ansible.builtin.fetch:
        src: "{{ remote_v5_path }}"
        dest: "{{ local_v5_path }}"
        flat: true

- name: Run migration locally
  hosts: localhost
  gather_facts: false
  vars:
    project_dir: "{{ playbook_dir }}"
    client_source_xml_path: "{{ project_dir }}/files/client_sources/client1_source.xml"
    master_config_xml_path: "{{ project_dir }}/files/master_templates/master_config.xml"
    output_template_path: "{{ project_dir }}/templates/config_target.j2"
    output_vars_path: "{{ project_dir }}/vars/vars_client1.yaml"
    output_report_path: "{{ project_dir }}/reports/mappings/mapping_report_client1.txt"
    python_executable: "{{ lookup('env','HOME') }}/venvs/migration/bin/python3"
  tasks:
    - name: Run XML migration script
      ansible.builtin.command:
        argv:
          - "{{ python_executable }}"
          - "{{ project_dir }}/../utils/xml_migration.py"
          - "{{ client_source_xml_path }}"
          - "{{ master_config_xml_path }}"
          - --out-template
          - "{{ output_template_path }}"
          - --out-vars
          - "{{ output_vars_path }}"
          - --out-report
          - "{{ output_report_path }}"
      args:
        chdir: "{{ project_dir }}"
      register: migration_out
      changed_when: false

    - name: Show migration output
      ansible.builtin.debug:
        msg: |
          rc={{ migration_out.rc }}
          stdout={{ migration_out.stdout }}
          stderr={{ migration_out.stderr }}

    - name: Check generated vars file exists
      ansible.builtin.stat:
        path: "{{ output_vars_path }}"
      register: vars_yaml_stat

    - name: Fail if vars file was not generated
      ansible.builtin.fail:
        msg: "Migration did not create vars file at {{ output_vars_path }}"
      when: not vars_yaml_stat.stat.exists

- name: Render final filled XML
  hosts: localhost
  gather_facts: false
  vars:
    project_dir: "{{ playbook_dir }}"
    output_vars_path: "{{ project_dir }}/vars/vars_client1.yaml"
    rendered_template_path: "{{ project_dir }}/templates/config_target.j2"
    output_xml_path: "{{ project_dir }}/final/client1_config.xml"
  tasks:
    - name: Load generated variables
      ansible.builtin.include_vars:
        file: "{{ output_vars_path }}"

    - name: Debug: show top-level generated vars keys
      ansible.builtin.debug:
        msg: "generated vars keys={{ vars.keys() | list }}"

    - name: Debug: show 'messaging' as YAML
      ansible.builtin.debug:
        msg: "{{ messaging | default({}) | to_nice_yaml }}"

    - name: Debug: is 'messaging' a mapping?
      ansible.builtin.debug:
        msg: "messaging_is_mapping={{ messaging is mapping }}"

    - name: Debug: show 'modules' as YAML
      ansible.builtin.debug:
        msg: "{{ modules | default({}) | to_nice_yaml }}"

    - name: Debug: is 'modules' a mapping?
      ansible.builtin.debug:
        msg: "modules_is_mapping={{ modules is mapping }}"

    - name: Generate client1_config.xml locally
      ansible.builtin.template:
        src: "{{ rendered_template_path }}"
        dest: "{{ output_xml_path }}"

- name: Copy final_config.xml to Windows
  hosts: windows
  gather_facts: false
  vars:
    project_dir: "{{ playbook_dir }}"
    windows_output_path: "C:\\Users\\vboxuser\\Desktop\\project\\final_config.xml"
  tasks:
    - name: Send final_config.xml to Windows target
      ansible.windows.win_copy:
        src: "{{ project_dir }}/final/client1_config.xml"
        dest: "{{ windows_output_path }}"

- name: Run tests and debug scripts
  hosts: localhost
  gather_facts: false
  vars:
    project_dir: "{{ playbook_dir }}"
    debug_dir: "{{ project_dir }}/debug"
    python_executable: "{{ lookup('env','HOME') }}/venvs/migration/bin/python3"
  tasks:
    - name: Run score_probe.py
      ansible.builtin.command:
        argv:
          - "{{ python_executable }}"
          - "{{ project_dir }}/tests/score_probe.py"
      register: score_probe_out
      ignore_errors: true

    - name: Save score_probe output
      ansible.builtin.copy:
        content: "{{ score_probe_out.stdout }}\n{{ score_probe_out.stderr }}"
        dest: "{{ debug_dir }}/score_probe.log"

    - name: Run test_xml_migration.py
      ansible.builtin.command:
        argv:
          - "{{ python_executable }}"
          - -m
          - unittest
          - "{{ project_dir }}/tests/test_xml_migration.py"
      register: test_xml_out
      ignore_errors: true

    - name: Save test_xml_migration output
      ansible.builtin.copy:
        content: "{{ test_xml_out.stdout }}\n{{ test_xml_out.stderr }}"
        dest: "{{ debug_dir }}/test_xml_migration.log"

    - name: Run debug_match.py
      ansible.builtin.command:
        argv:
          - "{{ python_executable }}"
          - "{{ project_dir }}/utils/debug_match.py"
      register: debug_match_out
      ignore_errors: true

    - name: Save debug_match output
      ansible.builtin.copy:
        content: "{{ debug_match_out.stdout }}\n{{ debug_match_out.stderr }}"
        dest: "{{ debug_dir }}/debug_match.log"

    - name: Run debug_parser.py
      ansible.builtin.command:
        argv:
          - "{{ python_executable }}"
          - "{{ project_dir }}/utils/debug_parser.py"
      register: debug_parser_out
      ignore_errors: true

    - name: Save debug_parser output
      ansible.builtin.copy:
        content: "{{ debug_parser_out.stdout }}\n{{ debug_parser_out.stderr }}"
        dest: "{{ debug_dir }}/debug_parser.log"
